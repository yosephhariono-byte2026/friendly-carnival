<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Lintas Nusa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Silkscreen:wght@400;700&display=swap">
<style>
/* layout: one 16:9 arcade screen centred on a night-sky page; HUD sits in the screen corners; touch pad below (portrait) or over the corners (landscape) */
:root{
  --night:#0d0b24; --ink:#f7f1dc; --teal:#19c6b4; --sun:#ffb347; --coral:#ff5a6a; --plum:#3a1f5e; --dim:#a79fc9;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --hud:'Silkscreen','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--night); color:var(--ink); font-family:var(--hud);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding-block:8px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box; overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
.screen{
  position:relative; width:min(100%,calc((100dvh - 32px) * 16 / 9)); max-width:100%; aspect-ratio:16/9;
  container-type:inline-size; background:#000; overflow:hidden; border-radius:6px;
  box-shadow:0 0 0 2px var(--plum),0 0 60px rgba(255,90,106,.18);
}
canvas{position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; display:block}
.hud{position:absolute; inset:0; pointer-events:none; font-size:2.3cqw; line-height:1.1; text-shadow:.25cqw .25cqw 0 rgba(13,11,36,.85); font-variant-numeric:tabular-nums}
.hud > div{position:absolute}
.lbl{font-size:1.5cqw; color:var(--sun); letter-spacing:.12em; display:block}
#hScore{left:2.5cqw; top:2cqw}
#hTime{left:50%; top:1.6cqw; transform:translateX(-50%); text-align:center}
#hTime b{font-family:var(--display); font-weight:400; font-size:6cqw; color:var(--ink); display:block; line-height:1}
#hTime.low b{color:var(--coral)}
#hSpeed{right:2.5cqw; top:2cqw; text-align:right}
#hSpeed b{font-family:var(--display); font-weight:400; font-size:4.4cqw}
#hSpeed small{font-size:1.5cqw; color:var(--dim)}
#hStage{right:2.5cqw; bottom:2.2cqw; text-align:right; font-size:1.7cqw; color:var(--ink)}
.bar{width:16cqw; height:1.3cqw; border:.3cqw solid var(--ink); margin-top:.5cqw; margin-left:auto; background:rgba(13,11,36,.6)}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--sun),var(--coral))}
#hMap{left:2.5cqw; bottom:2cqw; width:15cqw}
#hMap svg{width:100%; height:auto; display:block; overflow:visible}
#hMap line{stroke:var(--dim); stroke-width:1.2; opacity:.6}
#hMap line.on{stroke:var(--sun); opacity:1}
#hMap circle{fill:var(--night); stroke:var(--dim); stroke-width:1.4}
#hMap circle.on{fill:var(--sun); stroke:var(--ink)}
#hMap circle.cur{fill:var(--coral); stroke:var(--ink)}
#hFork{left:50%; top:13cqw; transform:translateX(-50%); white-space:nowrap; font-size:2.1cqw; background:rgba(13,11,36,.78); padding:.7cqw 1.6cqw; border:.3cqw solid var(--sun); color:var(--ink)}
#hMsg{left:50%; top:36%; transform:translate(-50%,-50%); text-align:center; white-space:nowrap}
#hMsg b{font-family:var(--display); font-weight:400; font-size:7cqw; color:var(--sun); display:block; text-shadow:.5cqw .5cqw 0 var(--plum)}
#hMsg span{font-size:2.3cqw}
.btn{pointer-events:auto; font:inherit; color:var(--ink); background:rgba(13,11,36,.7); border:.25cqw solid var(--dim); padding:.4cqw 1cqw; cursor:pointer; font-size:1.5cqw}
#bMute{position:absolute; left:2.5cqw; top:8cqw}
.btn:focus-visible,.big:focus-visible,.tape:focus-visible{outline:.4cqw solid var(--teal); outline-offset:.3cqw}

.panel{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2cqw; text-align:center;
  background:linear-gradient(180deg,rgba(13,11,36,.2),rgba(13,11,36,.72)); font-size:1.9cqw; padding:2cqw; box-sizing:border-box}
.logo{font-family:var(--display); font-size:10.5cqw; line-height:.9; margin:0; font-weight:400; color:var(--ink); letter-spacing:.02em;
  text-shadow:.45cqw .45cqw 0 var(--coral),.9cqw .9cqw 0 var(--plum); text-wrap:balance}
.logo em{font-style:normal; color:var(--sun)}
.tag{margin:0; color:var(--ink); letter-spacing:.18em; font-size:1.8cqw}
.tapes{display:flex; gap:1.6cqw; flex-wrap:wrap; justify-content:center}
.tape{font:inherit; font-size:1.5cqw; color:var(--night); background:var(--ink); border:.35cqw solid var(--night); border-radius:.8cqw; padding:.9cqw 1.4cqw 1.1cqw; cursor:pointer; min-width:19cqw; position:relative; box-shadow:0 .5cqw 0 rgba(0,0,0,.4)}
.tape small{display:block; font-size:1.15cqw; opacity:.7; margin-bottom:.3cqw; letter-spacing:.1em}
.tape::after{content:""; display:block; height:1.6cqw; margin-top:.6cqw; border-radius:1cqw;
  background:radial-gradient(circle at 28% 50%,var(--ink) 0 .45cqw,transparent .5cqw),radial-gradient(circle at 72% 50%,var(--ink) 0 .45cqw,transparent .5cqw),var(--night)}
.tape[aria-pressed="true"]{background:var(--sun); transform:translateY(-.5cqw); box-shadow:0 1cqw 0 rgba(0,0,0,.4)}
.big{font-family:var(--display); font-size:3.6cqw; color:var(--night); background:var(--teal); border:.4cqw solid var(--ink); padding:.8cqw 4cqw; cursor:pointer; box-shadow:.6cqw .6cqw 0 var(--plum)}
.big:hover{background:var(--sun)}
.hint{margin:0; color:var(--ink); opacity:.85; font-size:1.45cqw; line-height:1.5}
.res{margin:0; font-size:2cqw; line-height:1.6}
.res b{color:var(--sun)}
.h2{font-family:var(--display); font-weight:400; font-size:6.5cqw; margin:0; color:var(--sun); text-shadow:.45cqw .45cqw 0 var(--plum); line-height:1}

.pad{display:none; width:100%; max-width:560px; justify-content:space-between; gap:12px}
.pad div{display:flex; gap:10px}
.pad button{font-family:var(--display); font-size:20px; color:var(--ink); background:var(--plum); border:3px solid var(--dim); border-radius:14px; width:74px; height:74px; touch-action:none}
.pad button.on{background:var(--coral); border-color:var(--ink)}
.pad button.sm{font-size:12px}
@media (pointer:coarse){
  .pad{display:flex}
  .hint.kb{display:none}
}
@media (pointer:coarse) and (orientation:landscape){
  .pad{position:fixed; left:0; right:0; bottom:calc(10px + env(safe-area-inset-bottom,0px)); max-width:none; box-sizing:border-box;
    padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); pointer-events:none}
  .pad button{pointer-events:auto; opacity:.6; width:64px; height:64px}
}
</style>

<div class="screen" id="screen">
  <canvas id="cv" width="480" height="270" aria-label="Layar permainan balap Lintas Nusa"></canvas>

  <div class="hud" id="hud" hidden>
    <div id="hScore"><span class="lbl">SKOR</span><span id="vScore">0</span></div>
    <div id="hTime"><span class="lbl">WAKTU</span><b id="vTime">70</b></div>
    <div id="hSpeed"><b id="vSpeed">0</b> <small>KM/J</small><div class="bar" title="Turbo"><i id="vBoost"></i></div><span class="lbl" style="margin-top:.4cqw">TURBO</span></div>
    <div id="hStage"><span class="lbl">ETAPE <span id="vLeg">1</span>/3</span><span id="vStage">Pantai Fajar</span></div>
    <div id="hMap">
      <svg viewBox="0 0 80 40" aria-hidden="true">
        <line id="l-sawah" x1="8" y1="20" x2="40" y2="9"/><line id="l-gunung" x1="8" y1="20" x2="40" y2="31"/>
        <line id="l-sawah-danau" x1="40" y1="9" x2="72" y2="4"/><line id="l-sawah-kota" x1="40" y1="9" x2="72" y2="20"/>
        <line id="l-gunung-kota" x1="40" y1="31" x2="72" y2="20"/><line id="l-gunung-kawah" x1="40" y1="31" x2="72" y2="36"/>
        <circle id="n-pantai" cx="8" cy="20" r="3.4"/><circle id="n-sawah" cx="40" cy="9" r="3.4"/><circle id="n-gunung" cx="40" cy="31" r="3.4"/>
        <circle id="n-danau" cx="72" cy="4" r="3.4"/><circle id="n-kota" cx="72" cy="20" r="3.4"/><circle id="n-kawah" cx="72" cy="36" r="3.4"/>
      </svg>
    </div>
    <div id="hFork" hidden></div>
    <div id="hMsg" hidden><b id="vMsg"></b><span id="vSub"></span></div>
    <button class="btn" id="bMute" type="button">SUARA: ON</button>
  </div>

  <div class="panel" id="pTitle">
    <h1 class="logo">LINTAS <em>NUSA</em></h1>
    <p class="tag">BALAP SANTAI MELINTASI NUSANTARA</p>
    <div class="tapes" role="group" aria-label="Pilih kaset musik">
      <button class="tape" id="tape0" type="button" aria-pressed="true"><small>KASET A</small>Angin Laut</button>
      <button class="tape" id="tape1" type="button" aria-pressed="false"><small>KASET B</small>Lampu Kota</button>
      <button class="tape" id="tape2" type="button" aria-pressed="false"><small>KASET C</small>Gamelan Senja</button>
    </div>
    <button class="big" id="bStart" type="button">GAS!</button>
    <p class="hint kb">PANAH / WASD: SETIR, GAS, REM &nbsp;·&nbsp; SPASI: TURBO &nbsp;·&nbsp; P: JEDA &nbsp;·&nbsp; M: SUARA</p>
    <p class="hint">PILIH JALUR DI TIAP PERSIMPANGAN. ADA 3 TUJUAN AKHIR. <span id="vBest"></span></p>
  </div>

  <div class="panel" id="pEnd" hidden>
    <h2 class="h2" id="vEndTitle">SAMPAI!</h2>
    <p class="res" id="vEndBody"></p>
    <button class="big" id="bAgain" type="button">MAIN LAGI</button>
  </div>
</div>

<div class="pad" id="pad" aria-label="Kontrol sentuh">
  <div><button type="button" id="tL" aria-label="Kiri">&#9664;</button><button type="button" id="tR" aria-label="Kanan">&#9654;</button></div>
  <div><button type="button" id="tB" class="sm" aria-label="Rem">REM</button><button type="button" id="tT" class="sm" aria-label="Turbo">TURBO</button></div>
</div>

<script>
(()=>{
'use strict';
const W=480,H=270,HZ=122,SEG=200,ROAD=2000,CAMH=1300,DEPTH=0.84,PZ=CAMH*DEPTH*1.15,DRAW=150,MAXS=SEG*60,FS=1.6,CENT=0.2;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeIn=(a,b,t)=>a+(b-a)*t*t,easeIO=(a,b,t)=>a+(b-a)*(-Math.cos(t*Math.PI)/2+.5);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const css=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const shade=(h,f)=>css(hex(h).map(v=>clamp(v*f,0,255)));

/* ---------- stages ---------- */
const STAGES={
 pantai:{name:'Pantai Fajar',seed:11,len:2300,bg:'islands',traffic:14,cmax:3,hmax:12,next:['sawah','gunung'],water:-1,wedge:3.4,sun:[330,92,20],stars:0,
  pal:{skyT:'#27348b',skyB:'#ffb68a',fog:'#ffd2a6',sun:'#fff3c4',gL0:'#f1dba3',gL1:'#e9cf90',gR0:'#63bf5c',gR1:'#57b254',rd0:'#6f6a78',rd1:'#696472',ru0:'#f7f2e4',ru1:'#e8604f',ln:'#f7f2e4',wa0:'#1fb9b2',wa1:'#2ac6bd',foam:'#eafff8',pad:'#9bd8d0',cloud:'#ffe3cf',m1:'#7a78b8',m2:'#5e62a8'}},
 sawah:{name:'Sawah Hijau',seed:23,len:2400,bg:'hills',traffic:20,cmax:4,hmax:30,next:['danau','kota'],paddy:1,sun:[110,26,11],stars:0,
  pal:{skyT:'#1f7fe0',skyB:'#c9eeff',fog:'#d6f1e6',sun:'#ffffff',gL0:'#4cb84a',gL1:'#41aa45',gR0:'#4cb84a',gR1:'#41aa45',rd0:'#74707a',rd1:'#6e6a74',ru0:'#f7f2e4',ru1:'#f2c230',ln:'#f7f2e4',wa0:'#1fb9b2',wa1:'#2ac6bd',foam:'#eafff8',pad:'#a8e0dc',cloud:'#ffffff',m1:'#86b9d0',m2:'#3d9468'}},
 gunung:{name:'Lereng Api',seed:37,len:2400,bg:'volcano',traffic:18,cmax:5,hmax:45,next:['kota','kawah'],sun:[110,86,15],stars:0,
  pal:{skyT:'#4c3f78',skyB:'#f5a55c',fog:'#e8a868',sun:'#ffe08a',gL0:'#a98842',gL1:'#9d7c3a',gR0:'#a98842',gR1:'#9d7c3a',rd0:'#5d5560',rd1:'#57505a',ru0:'#f0e6d0',ru1:'#3a3038',ln:'#f0e6d0',wa0:'#ff5a1f',wa1:'#ff8a2a',foam:'#ffd36b',pad:'#c9a45a',cloud:'#f7c59a',m1:'#4d3156',m2:'#6b4a3a'}},
 danau:{name:'Danau Senja',seed:41,len:2500,bg:'hills',traffic:24,cmax:4.5,hmax:30,water:1,wedge:2.7,sun:[250,98,26],stars:0,
  pal:{skyT:'#34205f',skyB:'#ff7a5c',fog:'#f58a6a',sun:'#ffd27a',gL0:'#2f8057',gL1:'#2a744e',gR0:'#3b8a5a',gR1:'#357f52',rd0:'#5a5266',rd1:'#544c60',ru0:'#ffe9c9',ru1:'#e0563f',ln:'#ffe9c9',wa0:'#c85a80',wa1:'#d4688a',foam:'#ffd9c9',pad:'#c85a80',cloud:'#ff9e80',m1:'#5b2f73',m2:'#3d2a66'}},
 kota:{name:'Kota Malam',seed:53,len:2500,bg:'skyline',traffic:30,cmax:4,hmax:25,sun:[380,34,12],moon:1,stars:40,
  pal:{skyT:'#07071f',skyB:'#2c1b5a',fog:'#241a4a',sun:'#f4f0d8',gL0:'#1d1c30',gL1:'#191829',gR0:'#1d1c30',gR1:'#191829',rd0:'#2d2c40',rd1:'#29283b',ru0:'#ff3fa4',ru1:'#19e3d8',ln:'#ffe66b',wa0:'#19e3d8',wa1:'#19e3d8',foam:'#ffffff',pad:'#241a4a',cloud:'#3a2a6a',m1:'#15133a',m2:'#0e0c26'}},
 kawah:{name:'Kawah Bintang',seed:67,len:2500,bg:'crater',traffic:22,cmax:5,hmax:40,water:-1,wedge:3,sun:[90,34,10],moon:1,stars:130,
  pal:{skyT:'#04030d',skyB:'#3d1030',fog:'#3a1428',sun:'#f4f0d8',gL0:'#2c1e26',gL1:'#261a21',gR0:'#2c1e26',gR1:'#261a21',rd0:'#3a3038',rd1:'#352b33',ru0:'#ffb347',ru1:'#5a2020',ln:'#ffd9a0',wa0:'#ff5a1f',wa1:'#ff8a2a',foam:'#ffd36b',pad:'#3a1428',cloud:'#5a2038',m1:'#1c0f1c',m2:'#120a14'}}
};
for(const k in STAGES){const s=STAGES[k];s.key=k;s.rgb={};for(const c in s.pal)s.rgb[c]=hex(s.pal[c])}

/* ---------- sprite art (all drawn in code) ---------- */
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c}
const flip=c=>mk(c.width,c.height,g=>{g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0)});
const R=(g,c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
const PG=(g,c,p)=>{g.fillStyle=c;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill()};
const CI=(g,c,x,y,r)=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()};
const EL=(g,c,x,y,rx,ry)=>{g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()};
const LN=(g,c,w,p)=>{g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.stroke()};
const TX=(g,c,t,x,y,s)=>{g.fillStyle=c;g.font=`bold ${s}px Arial,Helvetica,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(t,x,y)};

function palm(lean){return mk(100,150,g=>{
  let tx=50,ty=40;
  for(let i=0;i<22;i++){const t=i/21,x=50-lean*10+lean*24*t*t,w=9-t*4;R(g,i%2?'#8a5a3a':'#75492e',x-w/2,150-(i+1)*5.1,w,5.6);tx=x;ty=150-(i+1)*5.1}
  const A=[-2.95,-2.5,-2.0,-1.57,-1.1,-.65,-.2];
  for(let p=0;p<2;p++)A.forEach((a,i)=>{const ex=tx+Math.cos(a)*(42-p*6),ey=ty+Math.sin(a)*18+20-p*3,cx=tx+Math.cos(a)*26,cy=ty+Math.sin(a)*30-8;
    g.strokeStyle=p?(i%2?'#3fb85c':'#2e9e4f'):'#1b6e3a';g.lineWidth=p?5:8;g.lineCap='round';g.beginPath();g.moveTo(tx,ty);g.quadraticCurveTo(cx,cy,ex,ey);g.stroke()});
  CI(g,'#5a3a22',tx-4,ty+4,3.5);CI(g,'#6b4526',tx+4,ty+5,3.5);
})}
const parasol=mk(60,60,g=>{R(g,'#f7f2e4',29,14,2,44);for(let i=0;i<6;i++){g.fillStyle=i%2?'#ff8a3d':'#f7f2e4';g.beginPath();g.moveTo(30,22);g.arc(30,22,28,Math.PI+i*Math.PI/6,Math.PI+(i+1)*Math.PI/6);g.fill()}
  R(g,'#19a5b8',36,50,20,3);R(g,'#19a5b8',52,42,3,10);R(g,'#0f7f8f',38,53,2,6);R(g,'#0f7f8f',52,53,2,6)});
const jukung=mk(130,70,g=>{PG(g,'#f7f2e4',[62,4,62,48,26,48]);PG(g,'#ff5a6a',[66,10,66,48,96,48]);R(g,'#5a3a22',62,2,3,50);
  PG(g,'#7a4a2a',[4,50,126,50,112,62,18,62]);R(g,'#f7f2e4',14,54,102,2);LN(g,'#5a3a22',2,[30,56,24,66,106,66,100,56]);R(g,'#eafff8',0,64,130,3)});
const gubuk=mk(120,90,g=>{R(g,'#6b4526',20,56,5,34);R(g,'#6b4526',95,56,5,34);R(g,'#6b4526',56,56,4,34);R(g,'#c9a45a',16,36,88,24);
  for(let x=18;x<104;x+=6)R(g,'#b08d48',x,36,1,24);R(g,'#3a2a1a',50,42,18,18);PG(g,'#8a6a2e',[2,38,60,2,118,38]);for(let i=0;i<7;i++)LN(g,'#6f5424',1.5,[60,4,10+i*16.5,38]);R(g,'#75592a',2,36,116,4)});
const warung=mk(130,90,g=>{R(g,'#e9d9b0',10,30,110,56);R(g,'#3a2a1a',18,42,94,26);R(g,'#ffd27a',22,46,86,6);

    if(limboStart>0&&pos>=limboStart*SEG){const side=px<0?-1:1,nk=stage.next[side<0?0:1],off=pos-limboStart*SEG;

  engO=AC.createOscillator();engO.type='sawtooth';engO2=AC.createOscillator();engO2.type='square';engF=AC.createBiquadFilter();engF.type='lowpass';engF.frequency.value=500;engG=AC.createGain();engG.gain.value=0;
  engO.connect(engF);engO2.connect(engF);engF.connect(engG);engG.connect(mG);engO.start();engO2.start()}
function tone(type,f,t,dur,vol,dest){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||muG);o.start(t);o.stop(t+dur+.05)}
function nz(t,dur,vol,ft,ff,dest){if(!AC)return;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nBuf;f.type=ft;f.frequency.value=ff;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||muG);s.start(t);s.stop(t+dur+.02)}
function kick(t,v){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(muG);o.start(t);o.stop(t+.25)}
const beep=(f,d)=>AC&&tone('square',f,AC.currentTime,d,.12,mG);
const thud=()=>{if(AC){nz(AC.currentTime,.35,.5,'lowpass',500,mG);tone('sine',70,AC.currentTime,.3,.4,mG)}};
const jingle=()=>{if(AC)[72,76,79,84,88].forEach((m,i)=>tone('square',mtof(m),AC.currentTime+i*.09,.22,.1,mG))};
const TRACKS=[
 {bpm:112,ch:[[50,54,57,61],[47,50,54,57],[43,47,50,54],[45,49,52,57]],bw:'triangle',bass:[1,0,0,1,0,0,3,0,0,0,1,0,2,0,3,0],aw:'triangle',arp:[0,-1,2,-1,3,-1,2,1,-1,2,-1,3,2,-1,1,-1],lw:'square',
  lead:[[[0,6,4],[4,5,2],[6,4,4],[12,5,3]],[[0,4,3],[3,5,3],[6,6,6],[14,5,2]],[[0,6,2],[2,5,2],[4,4,4],[8,5,2],[10,6,4]],[[0,5,6],[8,4,3],[11,5,4]]],k:[0,7,10],sn:[4,12],hh:[0,2,4,6,8,10,12,14]},
 {bpm:128,ch:[[45,48,52,55],[41,45,48,52],[48,52,55,59],[43,47,50,55]],bw:'sawtooth',bass:[1,0,1,0,1,0,1,3,1,0,1,0,1,0,3,2],aw:'square',arp:[4,2,1,2,4,2,1,2,5,2,1,2,4,2,1,2],lw:'sawtooth',
  lead:[[[0,4,6],[8,5,2],[10,6,4]],[[0,5,4],[4,4,4],[8,6,6]],[[0,6,3],[3,5,3],[6,4,2],[8,5,6]],[[0,4,2],[2,5,2],[4,6,2],[6,5,2],[8,4,8]]],k:[0,4,8,12],sn:[4,12],hh:[2,6,10,14,15]},
 {bpm:98,bell:1,ch:[[52,55,59,64],[48,53,55,60],[47,52,55,59],[53,55,60,64]],bw:'sine',bass:[1,0,0,0,0,0,0,0,2,0,0,0,0,0,0,0],aw:'sine',arp:[4,-1,6,5,-1,4,6,-1,5,4,-1,6,5,-1,4,5],lw:'sine',
  lead:[[[0,2,4],[6,3,2],[8,2,4],[12,1,4]],[[0,3,4],[4,2,2],[6,1,2],[8,3,6]],[[0,1,4],[4,2,4],[8,3,2],[10,2,2],[12,1,4]],[[0,3,8],[8,2,4],[12,3,4]]],k:[0,10],sn:[],hh:[4,12,14]}
];
function seqStep(t){const T=TRACKS[trackIdx],spb=60/T.bpm/4,bar=(step>>4),ch=T.ch[bar%4],s=step&15,ext=ch.concat(ch.map(n=>n+12));
  const b=T.bass[s];if(b)tone(T.bw,mtof(ch[0]-12+(b===2?7:b===3?12:0)),t,T.bell?1.6:spb*1.8,T.bell?.4:.2);
  const a=T.arp[s];if(a>=0){const f=mtof(ext[a]+12);if(T.bell){tone('sine',f,t,.5,.09);tone('sine',f*2.76,t,.18,.03)}else tone(T.aw,f,t,spb*.9,T.aw==='triangle'?.09:.035)}
  if(bar%8>=2||T.bell)for(const n of T.lead[(bar+(bar%8>=4?1:0))%4])if(n[0]===s){const f=mtof(ext[n[1]]+12);if(T.bell){tone('sine',f,t,.9,.13);tone('triangle',f*2,t,.3,.03)}else tone(T.lw,f,t,spb*n[2]*.95,T.lw==='square'?.06:.05)}
  if(T.k.includes(s))kick(t,T.bell?.35:.6);if(T.sn.includes(s))nz(t,.14,.22,'bandpass',1800);if(T.hh.includes(s))nz(t,.04,T.bell?.05:.09,'highpass',7000);
  if(T.bell&&s===0&&bar%4===0)tone('sine',mtof(40),t,3,.4)}
function musicStart(){if(!AC)return;musicStop();step=0;seqT=AC.currentTime+.1;seqTimer=setInterval(()=>{const spb=60/TRACKS[trackIdx].bpm/4;while(seqT<AC.currentTime+.15){seqStep(seqT);seqT+=spb;step++}},40)}
function musicStop(){if(seqTimer){clearInterval(seqTimer);seqTimer=null}}
function engine(){if(!AC)return;const on=mode==='play'||mode==='count'||mode==='finish'||mode==='over',sp=speed/MAXS,gr=Math.min(4,sp*5|0),wi=sp*5-gr,f=52+wi*62+gr*11+(mode==='count'?Math.random()*6:0);
  engO.frequency.setTargetAtTime(f,AC.currentTime,.05);engO2.frequency.setTargetAtTime(f/2,AC.currentTime,.05);engF.frequency.setTargetAtTime(350+sp*900,AC.currentTime,.05);engG.gain.setTargetAtTime(on?.05+sp*.03:0,AC.currentTime,.08)}
function setMute(m){muted=m;if(mG)mG.gain.value=m?0:.8;$('bMute').textContent='SUARA: '+(m?'OFF':'ON')}

/* ---------- input ---------- */
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)&&mode!=='title'&&mode!=='end')e.preventDefault();keys[k]=true;
  if(k==='m')setMute(!muted);if(k==='p')togglePause();
  if(k==='Enter'&&e.target.tagName!=='BUTTON'){if(mode==='title')startGame();else if(mode==='end')attract()}});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
let prevMode=null;
function togglePause(){if(mode==='pause'){mode=prevMode;$('hMsg').hidden=true;if(AC)AC.resume()}else if(mode==='play'){prevMode=mode;mode='pause';msg('JEDA','TEKAN P UNTUK LANJUT',1e9);if(AC)AC.suspend()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')togglePause()});
[['tL','tl'],['tR','tr'],['tB','tb'],['tT','tt']].forEach(([id,k])=>{const b=$(id);const on=e=>{e.preventDefault();touchMode=true;keys[k]=true;b.classList.add('on')},off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);b.addEventListener('contextmenu',e=>e.preventDefault())});
[0,1,2].forEach(i=>$('tape'+i).addEventListener('click',()=>{trackIdx=i;[0,1,2].forEach(j=>$('tape'+j).setAttribute('aria-pressed',j===i));audioInit();musicStart()}));
$('bStart').addEventListener('click',()=>{if(matchMedia('(pointer:coarse)').matches)touchMode=true;startGame()});
$('bAgain').addEventListener('click',()=>{musicStop();attract()});
$('bMute').addEventListener('click',()=>{setMute(!muted);$('bMute').blur()});
window.__goto=k=>{startGame(k);countT=.1};

/* ---------- loop ---------- */
let lastT=0,acc=0;
function frame(t){const dt=Math.min(.1,(t-lastT)/1000||0);lastT=t;acc+=dt;while(acc>=1/60){update(1/60);acc-=1/60}render();if(mode!=='title'&&mode!=='end')hud();engine();requestAnimationFrame(frame)}
attract();requestAnimationFrame(frame);
})();
</script>
